name: PR checks
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: ./.github/workflows/security.yml
  scope:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.hosted.outputs.native }}
      ui: ${{ steps.hosted.outputs.ui }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/test-scope-tests.py
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/test-scope.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
      # Hosted macOS minutes are opt-in: the macos-ci label or a manual dispatch.
      # Otherwise selected jobs are skipped and the PR relies on local Scripts/test.sh.
      - id: hosted
        env:
          NATIVE: ${{ steps.scope.outputs.native }}
          UI: ${{ steps.scope.outputs.ui }}
          HOSTED: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'macos-ci') }}
        run: |
          if [ "$HOSTED" = true ]; then
            echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
            echo "ui=$UI" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "ui=false" >> "$GITHUB_OUTPUT"
            if [ "$NATIVE" = true ] || [ "$UI" = true ]; then
              echo "::notice::Scope selected native=$NATIVE ui=$UI; hosted macOS jobs skipped. Add the macos-ci label to run them."
            fi
          fi
      - run: git diff --check
  native:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: brew install xcodegen swiftlint
      - run: |
          python3 -m venv /tmp/volant-ci-python
          /tmp/volant-ci-python/bin/pip install --require-hashes -r tools/security/requirements.txt
      - name: Build and non-UI tests
        env:
          VOLANT_TEST_PYTHON: /tmp/volant-ci-python/bin/python
        run: Scripts/test.sh --ci --ui never > /tmp/volant-native.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-test-results
          path: |
            /tmp/volant-native.log
            build/Logs/Test/*.xcresult
  ui:
    needs: scope
    if: needs.scope.outputs.ui == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - name: Native UI fixtures
        run: |
          if ! Scripts/test.sh --ci --ui only > /tmp/volant-ui.log 2>&1; then
            tail -100 /tmp/volant-ui.log
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-test-results
          path: |
            /tmp/volant-ui.log
            /tmp/volant-launcher-*.jpg
            /tmp/volant-home-*.jpg
            /tmp/volant-volume-*.jpg
            /tmp/volant-destinations-*.png
            /tmp/volant-snap-*.png
            /tmp/volant-core-*.png
            /tmp/volant-actions-*.png
            build/Logs/Test/*.xcresult
  checks:
    name: PR gate
    if: always()
    needs: [scope, native, ui, security]
    runs-on: ubuntu-latest
    steps:
      - env:
          SECURITY: ${{ needs.security.result }}
          SCOPE: ${{ needs.scope.result }}
          NATIVE: ${{ needs.native.result }}
          UI: ${{ needs.ui.result }}
          EXPECT_NATIVE: ${{ needs.scope.outputs.native }}
          EXPECT_UI: ${{ needs.scope.outputs.ui }}
        run: |
          test "$SECURITY" = success
          test "$SCOPE" = success
          if [ "$EXPECT_NATIVE" = true ]; then test "$NATIVE" = success; else test "$NATIVE" = skipped; fi
          if [ "$EXPECT_UI" = true ]; then test "$UI" = success; else test "$UI" = skipped; fi
