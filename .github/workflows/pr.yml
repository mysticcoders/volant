name: PR checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
      ui: ${{ steps.scope.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/test-scope-tests.py
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/test-scope.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
      - run: git diff --check
  native:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen swiftlint
      - run: |
          python3 -m venv /tmp/volant-ci-python
          /tmp/volant-ci-python/bin/pip install cryptography
      - name: Build and non-UI tests
        env:
          VOLANT_TEST_PYTHON: /tmp/volant-ci-python/bin/python
        run: Scripts/test.sh --ci --ui never > /tmp/volant-native.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: |
            /tmp/volant-native.log
            build/Logs/Test/*.xcresult
  ui:
    needs: scope
    if: needs.scope.outputs.ui == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Native UI fixtures
        run: Scripts/test.sh --ci --ui only > /tmp/volant-ui.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            /tmp/volant-ui.log
            /tmp/volant-launcher-*.jpg
            /tmp/volant-destinations-*.png
            /tmp/volant-snap-*.png
            /tmp/volant-core-*.png
            build/Logs/Test/*.xcresult
  checks:
    name: PR gate
    if: always()
    needs: [scope, native, ui]
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          NATIVE: ${{ needs.native.result }}
          UI: ${{ needs.ui.result }}
          EXPECT_NATIVE: ${{ needs.scope.outputs.native }}
          EXPECT_UI: ${{ needs.scope.outputs.ui }}
        run: |
          test "$SCOPE" = success
          if [ "$EXPECT_NATIVE" = true ]; then test "$NATIVE" = success; else test "$NATIVE" = skipped; fi
          if [ "$EXPECT_UI" = true ]; then test "$UI" = success; else test "$UI" = skipped; fi
