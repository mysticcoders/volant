name: Security checks
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks CLI (no licensed Action wrapper)
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/volant-security-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/volant-security-bin gitleaks
      - name: Scan all fetched history; redact candidate values
        run: /tmp/volant-security-bin/gitleaks git --redact --no-banner --log-opts=--all
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install checksum-verified OSV
        run: |
          curl --fail --silent --show-error --location https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          echo '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv-scanner' | sha256sum --check
          chmod +x /tmp/osv-scanner
      - run: python3 tools/security-dependencies-tests.py
      - run: python3 tools/security/check-inputs.py
      - name: Block new advisories and expired dependency debt
        run: python3 tools/security-dependencies.py --scanner /tmp/osv-scanner --output /tmp/volant-dependencies.json
      - name: Make existing debt visible even when the regression gate passes
        if: always()
        run: |
          echo '### Dependency security' >> "$GITHUB_STEP_SUMMARY"
          echo 'The initial 99 findings have been remediated and the baseline is empty. Every new package/version/advisory match blocks. A green scan is not proof of absence of vulnerabilities; see the full report and docs/security-remediation-2026-10-28.md.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-security-report
          path: /tmp/volant-dependencies.json
          if-no-files-found: error
          retention-days: 14
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install zizmor==1.31.1
      - run: zizmor --offline --min-severity medium .github/workflows
  website:
    # Browser checks run on PRs too; passive ZAP remains weekly/manual only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build and start local website
        working-directory: website
        run: |
          npm ci --ignore-scripts
          npm run build
          npm start -- --ip 127.0.0.1 --port 8787 > /tmp/volant-website.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/volant-website.log
          exit 1
      - name: Install pinned headless browser
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: Verify CSP, hydration and navigation
        working-directory: website
        run: |
          if ! npm run test:security > /tmp/volant-website-browser.log 2>&1; then
            cat /tmp/volant-website-browser.log
            exit 1
          fi
      - name: ZAP passive baseline; preserve warning exit status
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir /tmp/volant-zap
          cp tools/security/website.context /tmp/volant-zap/volant.context
          chmod 777 /tmp/volant-zap
          docker run --rm --network host -v /tmp/volant-zap:/zap/wrk:rw ghcr.io/zaproxy/zaproxy@sha256:0075662e5c287cf0a68caebabbfea872e5dc461912ad6d7345fa02a290d0ccb6 zap-baseline.py -t http://127.0.0.1:8787 -n volant.context -m 1 -T 5 -J report.json -r report.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: website-security-baseline
          path: |
            /tmp/volant-zap/
            /tmp/volant-website.log
            /tmp/volant-website-browser.log
            /tmp/volant-website-security/
          retention-days: 14
