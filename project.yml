name: Volant
options:
  bundleIdPrefix: com.mysticcoders
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: REMBT6JY4N
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Volant:
    type: application
    platform: macOS
    sources:
      - path: Volant
        excludes: ["Resources/config.example.json"]
      - path: Shared
    entitlements:
      path: Volant/Volant.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.calendars: true
    info:
      path: Volant/Info.plist
      properties:
        CFBundleName: Volant
        CFBundleDisplayName: Volant
        CFBundleIdentifier: com.mysticcoders.vey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright 2026 Mystic Coders, LLC"
        NSPrincipalClass: NSApplication
        NSContactsUsageDescription: "Volant searches your contacts so you can copy an email address or phone number. Read-only."
        NSCalendarsFullAccessUsageDescription: "Volant shows today's events and their meeting links. Read-only."
    dependencies:
      - target: VolantExtensionHost
        embed: true
      - target: VolantAgentHost
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.vey
        PRODUCT_NAME: Volant
        PRODUCT_MODULE_NAME: Volant
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VolantExtensionHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantExtensionHost
      - path: Shared
    entitlements:
      path: VolantExtensionHost/VolantExtensionHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: VolantExtensionHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.vey.ExtensionHost
        CFBundleName: VolantExtensionHost
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.vey.ExtensionHost
        GENERATE_INFOPLIST_FILE: NO
  VolantAgentHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantAgentHost
      - path: Shared/AgentProtocol.swift
    info:
      path: VolantAgentHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.AgentHost
        CFBundleName: VolantAgentHost
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.AgentHost
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
  VolantTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VolantTests
      - path: Shared
    dependencies:
      - target: Volant
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Volant.app/Contents/MacOS/Volant"
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.vey.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Volant:
    build:
      targets:
        Volant: all
        VolantTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [VolantTests]
