name: Volant
options:
  bundleIdPrefix: com.mysticcoders
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    # Strings come from String Catalogs: Localizable (app), Core (VolantCore's table, looked up in
    # the main bundle) and InfoPlist (permission prompts). See docs/localization.md.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Apple silicon only (decided November 3, 2026); Sparkle's generate_appcast then marks each
    # update arm64, so Intel Macs are not offered builds they cannot run.
    ARCHS: arm64
    # XcodeGen leaves Xcode's default (off). With VolantCore's -internalize-at-link, each helper keeps
    # only the core code it uses instead of all of it.
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: REMBT6JY4N
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "55"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
packages:
  VolantCore:
    path: Core
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Volant:
    type: application
    platform: macOS
    sources:
      - path: Volant
        excludes: ["Resources/config.example.json", "Resources/HelloWorld"]
      - path: Volant/Resources/HelloWorld
        type: folder
        buildPhase: resources
      - path: docs/releases
        type: folder
        buildPhase: resources
      # Extension SVG previews are drawn only in VolantExtensionHost; the app never draws extension SVG.
      - path: Shared
        excludes: ["ExtensionSVGRasterizer.swift"]
    info:
      path: Volant/Info.plist
      properties:
        CFBundleName: $(VOLANT_DISPLAY_NAME)
        CFBundleDisplayName: $(VOLANT_DISPLAY_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(VOLANT_UPDATE_FEED_URL)
        SUPublicEDKey: $(VOLANT_UPDATE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        # Volant for iPhone shares this container; public so notes show in Finder as iCloud Drive > Volant.
        NSUbiquitousContainers:
          iCloud.com.mysticcoders.volant:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Volant
            NSUbiquitousContainerSupportedFolderLevels: Any
        SUEnableDownloaderService: true
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright 2026 Mystic Coders, LLC"
        NSPrincipalClass: NSApplication
        NSContactsUsageDescription: "Volant searches your contacts so you can copy an email address or phone number. Read-only."
        NSBluetoothAlwaysUsageDescription: "Volant lists connected Bluetooth devices when you open the Bluetooth command."
        NSBluetoothPeripheralUsageDescription: "Volant lists connected Bluetooth devices on request."
        NSLocationWhenInUseUsageDescription: "macOS requires Location access to show Wi-Fi network names. Volant also uses your approximate location (about 11 km) only for extensions you allow, which share it with the sites they read; it is never saved."
        NSLocationUsageDescription: "macOS requires Location access to show Wi-Fi network names. Volant also uses your approximate location (about 11 km) only for extensions you allow, which share it with the sites they read; it is never saved."
        NSCalendarsFullAccessUsageDescription: "Volant shows today's events and their meeting links. Read-only."
        NSMicrophoneUsageDescription: "Volant transcribes dictation on this Mac. Audio is never sent anywhere and is not saved."
        NSAppleEventsUsageDescription: "Volant asks macOS to show its restart, shut down and log out confirmations and asks System Events to switch appearance or menu bar hiding, only when you choose those commands. During a Focus session that blocks websites, it asks the browser in front for its current tab’s address."
        NSCameraUsageDescription: "Volant shows a live preview from your camera only while the Open Camera window is open. Nothing is recorded, saved or sent."
    dependencies:
      - package: VolantCore
      - package: Sparkle
      - target: VolantExtensionHost
        embed: true
      - target: VolantAgentHost
        embed: true
      - target: VolantAIHost
        embed: true
      - target: VolantRatesHost
        embed: true
      - target: VolantWeatherHost
        embed: true
      - target: VolantFetchHost
        embed: true
      - target: VolantInputHost
        embed: true
    # Debug builds are "Volant Dev" with their own bundle ID, so macOS keeps their Accessibility,
    # Microphone and Location grants, sandbox container, Keychain items and iCloud store apart from
    # the installed app. A same-ID build with a different signature leaves the installed app's
    # Accessibility switch on while macOS refuses it. Debug builds have no update feed.
    # tools/check-dev-entitlements.py keeps VolantDev.entitlements equal to Volant.entitlements minus iCloud.
    settings:
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.dev
          VOLANT_DISPLAY_NAME: Volant Dev
          VOLANT_UPDATE_FEED_URL: ""
          # No iCloud key-value entitlement, so no provisioning profile: dev builds sign with the
          # development certificate alone and never sync settings into the owner's iCloud store.
          CODE_SIGN_ENTITLEMENTS: Volant/VolantDev.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: ""
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant
        VOLANT_DISPLAY_NAME: Volant
        # Volant.entitlements is maintained by hand; Restart, Shut Down and Log Out use the loginwindow
        # Apple-events exception to show its own confirmation dialog (docs/system-actions-spike.md).
        CODE_SIGN_ENTITLEMENTS: Volant/Volant.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(VOLANT_PROVISIONING_PROFILE)
        PRODUCT_NAME: Volant
        PRODUCT_MODULE_NAME: Volant
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        VOLANT_UPDATE_FEED_URL: https://usevolant.com/updates/appcast.xml
        VOLANT_UPDATE_PUBLIC_KEY: "iygB/kS8RY5Jh1g/IkvPRHy47iXRWqFR71jJCz9oTgY="
  VolantExtensionHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantExtensionHost
      - path: Shared
    dependencies:
      - package: VolantCore
    entitlements:
      path: VolantExtensionHost/VolantExtensionHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.cs.allow-jit: true
    info:
      path: VolantExtensionHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.ExtensionHost
        CFBundleName: VolantExtensionHost
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.ExtensionHost
        GENERATE_INFOPLIST_FILE: NO
  VolantAIHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantAIHost
    dependencies:
      - package: VolantCore
    entitlements:
      path: VolantAIHost/VolantAIHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: VolantAIHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.AIHost
        CFBundleName: VolantAIHost
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.AIHost
        GENERATE_INFOPLIST_FILE: NO
  VolantRatesHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantRatesHost
    dependencies:
      - package: VolantCore
    entitlements:
      path: VolantRatesHost/VolantRatesHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: VolantRatesHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.RatesHost
        CFBundleName: VolantRatesHost
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.RatesHost
        GENERATE_INFOPLIST_FILE: NO
  VolantWeatherHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantWeatherHost
    dependencies:
      - package: VolantCore
    entitlements:
      path: VolantWeatherHost/VolantWeatherHost.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: VolantWeatherHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.WeatherHost
        CFBundleName: VolantWeatherHost
        # WeatherKit words conditions in the owner's language only when the helper allows it.
        CFBundleAllowMixedLocalizations: true
        XPCService:
          ServiceType: Application
    # WeatherKit is a restricted entitlement, so this helper needs a provisioning profile: automatic
    # signing makes a development one, and release builds use the "Volant mobile weather Developer ID"
    # profile that Scripts/release.sh names (docs/weather.md).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.WeatherHost
        PROVISIONING_PROFILE_SPECIFIER: $(VOLANT_WEATHER_PROVISIONING_PROFILE)
        GENERATE_INFOPLIST_FILE: NO
  VolantFetchHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantFetchHost
      # Decodes row image downloads into PNG thumbnails here, so the app never decodes them; the app
      # uses the same format checks only for a copy the owner chose.
      - path: Shared/ExtensionImageDecoding.swift
    dependencies:
      - package: VolantCore
    entitlements:
      path: VolantFetchHost/VolantFetchHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: VolantFetchHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.FetchHost
        CFBundleName: VolantFetchHost
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.FetchHost
        GENERATE_INFOPLIST_FILE: NO
  VolantAgentHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantAgentHost
      - path: Shared/HerdrProcess.swift
      - path: Shared/HerdrQuestion.swift
      - path: Shared/HerdrClaudeQuestion.swift
      - path: Shared/HerdrCodexApproval.swift
      - path: Shared/HerdrResponseController.swift
    dependencies:
      - package: VolantCore
    info:
      path: VolantAgentHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.AgentHost
        CFBundleName: VolantAgentHost
        XPCService:
          ServiceType: Application
          JoinExistingSession: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.AgentHost
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
  # Types dictation at the cursor. The only target that may use Accessibility or post events
  # (tools/check-input-confinement.py). Unsandboxed like VolantAgentHost, with no entitlements;
  # launched only when the owner chooses Type at the cursor. See docs/dictation-at-cursor-design.md.
  VolantInputHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantInputHost
    dependencies:
      - package: VolantCore
    info:
      path: VolantInputHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.InputHost
        CFBundleName: VolantInputHost
        XPCService:
          ServiceType: Application
          JoinExistingSession: true
          RunLoopType: NSRunLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.InputHost
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
  VolantTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VolantTests
      - path: Shared
      - path: VolantRatesHost/RatesHost.swift
    dependencies:
      - target: Volant
      # The host app already links the static core; linking it here duplicates the library.
      - package: VolantCore
        link: false
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Volant.app/Contents/MacOS/Volant"
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Volant:
    build:
      targets:
        Volant: all
        VolantTests: [test]
    run:
      config: Debug
    test:
      environmentVariables:
        VOLANT_UNIT_TESTING: "1"
      config: Debug
      targets: [VolantTests]
